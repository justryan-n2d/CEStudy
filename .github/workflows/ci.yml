name: CEStudy CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cestudy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app-checks:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Run ESLint
        run: npm run lint
      - name: Run tests
        run: npm run test -- --run
      - name: Build production assets
        run: npm run build
      - name: Verify Pages routing and security headers are packaged
        run: |
          test -f dist/_redirects
          test -f dist/_headers
          grep -q "Content-Security-Policy" dist/_headers
          grep -q "X-Content-Type-Options: nosniff" dist/_headers
      - name: Set up Python for backup encryption tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked backup crypto dependency
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-backup.txt
      - name: Check backup syntax, encryption, and retention behavior
        run: |
          for file in scripts/backup-supabase.sh scripts/weekly-db-backup.sh scripts/prune-weekly-backups.sh scripts/tests/weekly-backup-retention.test.sh scripts/tests/backup-encryption.test.sh; do
            bash -n "$file"
          done
          if grep -Fq 'CESTUDY_BACKUP_CERT_B64' scripts/weekly-db-backup.sh .github/workflows/weekly-db-backup.yml; then
            echo 'FAIL: the backup workflow must not rely on a long Base64 repository variable.' >&2
            exit 1
          fi
          grep -Fq 'backup-recipient-cert.pem' scripts/weekly-db-backup.sh
          grep -Fxq '!scripts/backup-recipient-cert.pem' .gitignore
          python -m py_compile scripts/encrypt-db-backup.py
          bash scripts/tests/backup-encryption.test.sh
          bash scripts/tests/weekly-backup-retention.test.sh

  database-security:
    name: Supabase migration and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start isolated Supabase stack
        run: supabase start
      - name: Test migrations and row-level security
        run: supabase test db
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
