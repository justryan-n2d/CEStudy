name: CEStudy CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cestudy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app-checks:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # Use npm install only until the lockfile is committed. CI should switch to npm ci after that.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run ESLint
        run: npm run lint
      - name: Run tests
        run: npm run test -- --run
      - name: Build production assets
        run: npm run build

  database-security:
    name: Supabase migration and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start isolated Supabase stack
        run: supabase start
      - name: Test migrations and row-level security
        run: supabase test db
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
