name: CEStudy CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cestudy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app-checks:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Run ESLint
        run: npm run lint
      - name: Run tests
        run: npm run test -- --run
      - name: Build production assets
        run: npm run build
      - name: Verify Pages routing and security headers are packaged
        run: |
          test -f dist/_redirects
          test -f dist/_headers
          grep -q "Content-Security-Policy" dist/_headers
          grep -q "X-Content-Type-Options: nosniff" dist/_headers
      - name: Check Supabase backup helper syntax
        run: bash -n scripts/backup-supabase.sh

  database-security:
    name: Supabase migration and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start isolated Supabase stack
        run: supabase start
      - name: Test migrations and row-level security
        run: supabase test db
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
