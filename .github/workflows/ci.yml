name: CEStudy CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: read
concurrency:
  group: cestudy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app-checks:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Prevent unpublished practice content in the public seed
        run: |
          if grep -Eiq 'insert[[:space:]]+into[[:space:]]+public\.practice_questions|practice_seed|"prompt"[[:space:]]*:|"choices"[[:space:]]*:|"correct_answer"[[:space:]]*:|"solution_steps"[[:space:]]*:|"explanation"[[:space:]]*:' supabase/seed.sql; then
            echo "::error::Unpublished practice-question content must not be stored in the public seed." >&2
            exit 1
          fi
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Run ESLint
        run: npm run lint
      - name: Run tests
        run: npm run test -- --run
      - name: Build production assets
        run: npm run build
      - name: Verify Pages routing and security headers are packaged
        run: |
          test -f dist/_redirects
          test -f dist/_headers
          grep -q "Content-Security-Policy" dist/_headers
          grep -q "X-Content-Type-Options: nosniff" dist/_headers
          grep -Fq "style-src 'self'" dist/_headers
          grep -Fq "style-src-attr 'unsafe-inline'" dist/_headers
          grep -Fq "script-src 'self'" dist/_headers
      - name: Install temporary browser test dependency
        run: npm install --prefix /tmp/cestudy-playwright --no-package-lock playwright@1.64.0
      - name: Install Chromium for rendered UI checks
        run: /tmp/cestudy-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Start built production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/cestudy-vite-preview.log 2>&1 &
          echo $! > /tmp/cestudy-vite-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cestudy-vite-preview.log
          exit 1
      - name: Verify dark-mode and keyboard behavior in Chromium
        env:
          CESTUDY_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_MODULE_PATH: /tmp/cestudy-playwright/node_modules/playwright
        run: node scripts/ui-theme-smoke.cjs
      - name: Stop built production preview
        if: always()
        run: |
          if [ -f /tmp/cestudy-vite-preview.pid ]; then
            kill "$(cat /tmp/cestudy-vite-preview.pid)" 2>/dev/null || true
          fi
      - name: Wait for this commit's Cloudflare Pages preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in $(seq 1 60); do
            result="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$PR_HEAD_SHA/check-runs" \
              | jq -r '[.check_runs[] | select(.name == "Cloudflare Pages")] | last | (.conclusion // .status // "")')"
            if [ "$result" = "success" ]; then
              echo "Cloudflare Pages check passed for $PR_HEAD_SHA"
              exit 0
            fi
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ] || [ "$result" = "timed_out" ]; then
              echo "::error::Cloudflare Pages preview failed for $PR_HEAD_SHA (result=$result)"
              exit 1
            fi
            sleep 5
          done
          echo "::error::Timed out waiting for the Cloudflare Pages check for $PR_HEAD_SHA"
          exit 1
      - name: Verify the deployed PR preview in Chromium
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CESTUDY_BASE_URL: https://feature-google-auth-streak-g-2k99.cestudy.pages.dev
          PLAYWRIGHT_MODULE_PATH: /tmp/cestudy-playwright/node_modules/playwright
        run: node scripts/ui-theme-smoke.cjs
      - name: Set up Python for backup encryption tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked backup crypto dependency
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-backup.txt
      - name: Check backup syntax, encryption, and retention behavior
        run: |
          for file in scripts/backup-supabase.sh scripts/weekly-db-backup.sh scripts/prune-weekly-backups.sh scripts/tests/weekly-backup-retention.test.sh scripts/tests/backup-encryption.test.sh scripts/tests/backup-verification.test.sh; do
            bash -n "$file"
          done
          if grep -Fq 'CESTUDY_BACKUP_CERT_B64' scripts/weekly-db-backup.sh .github/workflows/weekly-db-backup.yml; then
            echo 'FAIL: the backup workflow must not rely on a long Base64 repository variable.' >&2
            exit 1
          fi
          grep -Fq 'backup-recipient-cert.pem' scripts/weekly-db-backup.sh
          grep -Fxq '!scripts/backup-recipient-cert.pem' .gitignore
          grep -Fq 'rclone lsf "$remote_dir" --max-depth 1' scripts/weekly-db-backup.sh
          preflight_line="$(grep -nF 'rclone lsf "$remote_dir" --max-depth 1' scripts/weekly-db-backup.sh | cut -d: -f1)"
          dump_line="$(grep -nF 'pg_dump --no-password' scripts/weekly-db-backup.sh | cut -d: -f1)"
          test "$preflight_line" -lt "$dump_line"
          python -m py_compile scripts/encrypt-db-backup.py
          bash scripts/tests/backup-encryption.test.sh
          bash scripts/tests/weekly-backup-retention.test.sh
          bash scripts/tests/backup-verification.test.sh

  database-security:
    name: Supabase migration and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start isolated Supabase stack
        run: supabase start
      - name: Test migrations and row-level security
        run: supabase test db
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
