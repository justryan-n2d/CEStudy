name: Live website browser smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "13 20 * * *"
  workflow_run:
    workflows: ["CEStudy CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cestudy-live-smoke
  cancel-in-progress: false

jobs:
  live-browser-smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Check deployed website in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CESTUDY_BASE_URL: https://cestudy.pages.dev
      EXPECTED_SUPABASE_HOST: qqmdwltfgpqtcvdbcmto.supabase.co
      EXPECTED_PUBLISHED_QUESTION_COUNT: "0"
    steps:
      - name: Check out CEStudy
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install locked app dependencies
        run: npm ci
      - name: Install temporary browser test dependency
        run: npm install --prefix /tmp/cestudy-playwright --no-package-lock playwright@1.64.0
      - name: Install Chromium
        run: /tmp/cestudy-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Check browser test script syntax
        run: node --check scripts/live-smoke.cjs
      - name: Run live security and responsive smoke checks
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/cestudy-playwright/node_modules/playwright
        run: node scripts/live-smoke.cjs
      - name: Upload screenshots and safe test summary if checks fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cestudy-live-smoke-failure
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
