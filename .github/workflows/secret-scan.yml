name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "19 3 * * 1"

permissions:
  contents: read

concurrency:
  group: cestudy-secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan repository history for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
      # The action's pull_request event scans the PR commit range, not all history.
      # Keep that fast delta scan, and add a full-history check so a historical allowlist
      # change is actually validated against the commits it is intended to suppress.
      - name: Verify full Git history with Gitleaks
        if: github.event_name == 'pull_request'
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.24.3
        env:
          # Docker runs with a different UID than the checkout owner; mark only the mounted
          # workspace as safe so Git can enumerate the full history.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: detect --source /github/workspace --redact --exit-code 2 --verbose
