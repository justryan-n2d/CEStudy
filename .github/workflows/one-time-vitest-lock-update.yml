name: One-time Vitest lockfile remediation

on:
  push:
    branches:
      - security/vitest-4.1.11

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from the patched manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Run ESLint
        run: npm run lint
      - name: Run tests
        run: npm run test -- --run
      - name: Build production assets
        run: npm run build
      - name: Verify Pages routing and security headers are packaged
        run: |
          test -f dist/_redirects
          test -f dist/_headers
          grep -q "Content-Security-Policy" dist/_headers
          grep -q "X-Content-Type-Options: nosniff" dist/_headers
      - name: Commit updated lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches package.json."
          else
            git commit -m "security: lock patched Vitest dependency tree"
            git push origin HEAD:security/vitest-4.1.11
          fi
