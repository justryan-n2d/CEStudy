name: CEStudy Connectivity and Skeleton Browser Checks

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/connectivity-skeleton.yml"
      - "scripts/connectivity-skeleton-smoke.cjs"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cestudy-connectivity-skeleton-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-checks:
    name: Connectivity and skeleton browser verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build with test-only non-routable Supabase configuration
        env:
          VITE_SUPABASE_URL: https://cestudy-network-skeleton.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: cestudy-connectivity-browser-smoke-non-secret-sentinel
        run: npm run build

      - name: Install temporary Playwright dependency
        run: npm install --prefix /tmp/cestudy-playwright --no-package-lock playwright@1.64.0

      - name: Install Chromium
        run: /tmp/cestudy-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Start built production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 --strictPort > /tmp/cestudy-connectivity-preview.log 2>&1 &
          echo $! > /tmp/cestudy-connectivity-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cestudy-connectivity-preview.log
          exit 1

      - name: Verify connectivity notice and six page skeletons
        env:
          CESTUDY_BASE_URL: http://127.0.0.1:4174
          PLAYWRIGHT_MODULE_PATH: /tmp/cestudy-playwright/node_modules/playwright
        run: node scripts/connectivity-skeleton-smoke.cjs

      - name: Stop built preview
        if: always()
        run: |
          if [ -f /tmp/cestudy-connectivity-preview.pid ]; then
            kill "$(cat /tmp/cestudy-connectivity-preview.pid)" 2>/dev/null || true
          fi

      - name: Upload connectivity and skeleton visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cestudy-connectivity-skeleton-visual-review
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
