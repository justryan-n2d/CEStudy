project_id = "cestudy"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[studio]
enabled = true
port = 54323
[inbucket]
enabled = true
port = 54324

# Anonymous submissions are intentionally supported. The function validates and
# rate-limits every request, writes only to private tables, and never accepts client recipients.
[functions.submit-public-message]
verify_jwt = false


# Owner inbox validates its own access key and short-lived token.
[functions.feedback-inbox-admin]
verify_jwt = false

# Content review validates its own domain-separated owner token and rate-limits unlock attempts.
[functions.content-review-admin]
verify_jwt = false
